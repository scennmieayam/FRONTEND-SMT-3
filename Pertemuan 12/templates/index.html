<!DOCTYPE html>
<html>
<head>
    <title>STIKOM Ecommerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #fafafa;
        }
        .product-card {
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #0073e6;
            margin-bottom: 8px;
        }
        .product-stock {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Daftar Produk</h1>
        <div class="row g-4">
            {% for p in products %}
            <div class="col-md-4">
                <div class="card product-card mb-4">
                    <img src="/static/image/{{ p.gambar }}" class="card-img-top"/>
                    <div class="card-body">
                        <h5 class="card-title product-card-title">{{ p.name }}</h5>
                        <p class="product-price">Rp {{ p.price }}</p>
                        <p class="product-stock">Jumlah Stok : {{ p.jumlah }}</p>
                        <a href="/product/{{ p._id }}" class="btn btn-primary w-100">Detail</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
