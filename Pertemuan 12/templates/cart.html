<!DOCTYPE html>
<html>
<head>
    <title>Keranjang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #fafafa;
        }
        .cart-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .cart-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }
        .cart-info {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="cart-container">
            <h2 class="cart-title">Keranjang Belanja</h2>
            <p class="cart-info">Fitur keranjang masih sederhana</p>
            <a href="/" class="btn btn-primary">Belanja Lagi</a>
        </div>
    </div>
</body>
</html>
